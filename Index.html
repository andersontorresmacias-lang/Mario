<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Super Fontanero</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
body{display:flex;align-items:center;justify-content:center}
canvas{image-rendering:crisp-edges;image-rendering:pixelated;width:min(100vw,calc(100vh*256/224));aspect-ratio:256/224}
#pad{display:none;position:fixed;left:0;right:0;bottom:0;padding:14px;justify-content:space-between;pointer-events:none}
@media(pointer:coarse){#pad{display:flex}}
.grp{display:flex;gap:12px;pointer-events:auto}
.b{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.25);border:3px solid rgba(255,255,255,.6);color:#fff;font:bold 14px monospace;display:flex;align-items:center;justify-content:center}
.b.on{background:rgba(255,255,255,.55)}
</style></head>
<body>
<canvas id="c"></canvas>
<div id="pad">
  <div class="grp"><div class="b" data-k="l">◀</div><div class="b" data-k="r">▶</div></div>
  <div class="grp"><div class="b" data-k="s">RUN</div><div class="b" data-k="j">SALTO</div></div>
</div>
<script>
/* ============ 1. CONFIGURACIÓN (ajusta aquí la sensación del juego) ============ */
const GRAVEDAD = 0.34;          // caída normal y de enemigos
const GRAV_SALTO_MANTENIDO = 0.28; // gravedad al subir con la tecla presionada (salto más alto)
const GRAV_SALTO_SOLTADO = 0.95;   // gravedad al subir si se suelta la tecla (salto corto)
const FUERZA_SALTO = -6.4;      // impulso inicial del salto
const CAIDA_MAX = 7;            // velocidad máxima de caída
const ACEL = 0.10;              // aceleración al caminar
const FRICC = 0.08;             // fricción al soltar / derrapar
const VEL_CAMINAR = 1.5, VEL_CORRER = 2.6;
const VEL_ENEMIGO = 0.5, VEL_CAPARAZON = 2.8;
const VIDAS_INI = 3, TIEMPO_INI = 300;
const T = 16, VW = 256, VH = 224;   // tamaño de tile y resolución interna
const W = 156, H = 14, POLE = 148;  // ancho/alto del nivel (tiles) y columna de la bandera

const cv = document.getElementById('c'), g = cv.getContext('2d');
cv.width = VW; cv.height = VH; g.imageSmoothingEnabled = false;
const fr = (x, y, w, h) => g.fillRect(Math.round(x), Math.round(y), w, h);
const mk = (w, h, f) => { const c = document.createElement('canvas'); c.width = w; c.height = h; f(c.getContext('2d')); return c; };
const ov = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; // AABB

/* ============ 2. SONIDO (Web Audio API) ============ */
let AC = null;
function initAudio() { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); }
function snd(f, d, tipo = 'square', f2 = f, vol = .07, ret = 0) {
  if (!AC) return;
  const t0 = AC.currentTime + ret, o = AC.createOscillator(), v = AC.createGain();
  o.type = tipo; o.frequency.setValueAtTime(f, t0); o.frequency.exponentialRampToValueAtTime(f2, t0 + d);
  v.gain.setValueAtTime(vol, t0); v.gain.exponentialRampToValueAtTime(.001, t0 + d);
  o.connect(v); v.connect(AC.destination); o.start(t0); o.stop(t0 + d);
}
const SFX = {
  salto: () => snd(260, .2, 'square', 720),
  moneda: () => { snd(988, .07); snd(1319, .25, 'square', 1319, .07, .07); },
  golpe: () => snd(120, .1, 'triangle', 60, .25),
  romper: () => snd(200, .2, 'sawtooth', 40, .1),
  pisar: () => snd(300, .1, 'square', 90),
  dano: () => snd(400, .3, 'square', 100),
  hongo: () => [0,1,2,3,4,5].forEach(i => { const f = 300 * Math.pow(1.26, i); snd(f, .08, 'square', f, .07, i * .06); }),
  muerte: () => { snd(500, .15); snd(400, .15, 'square', 400, .07, .15); snd(300, .5, 'square', 60, .07, .3); },
  victoria: () => [523,659,784,1047,784,1047].forEach((f, i) => snd(f, .15, 'square', f, .07, i * .13))
};

/* ============ 3. SPRITES (pixel art generado en canvas) ============ */
const PAL = { R: '#d82800', B: '#0058f8', S: '#fca044', K: '#6c3000', Y: '#f8d800' };
const CABEZA = [
  "...RRRRR....","..RRRRRRRRR.","..KKKSSKS...",".KSKSSSKSSS.",".KSKKSSSKSSS",".KKSSSSKKKK.",
  "...SSSSSSS..","..RRBRRR....",".RRRBRRBRRR.","RRRRBBBBRRRR","SSRBYBBYBRSS","SSSBBBBBBSSS","SSBBBBBBBBSS"];
const PIERNAS = {
  quieto: ["..BBB..BBB..", ".KKK....KKK.", "KKKK....KKKK"],
  a: ["...BBBBBB...", "..KKKBB.KKK.", ".KKK.....KK."],
  b: ["..BBB.BBB...", "..KKK..KKK..", "..KKK..KKK.."],
  salto: ["..BBB...BBB.", "..KKK...KKKK", ".KK.......KK"]
};
// 0 quieto, 1 caminar A, 2 caminar B, 3 salto
const SPR = ['quieto', 'a', 'b', 'salto'].map(n => mk(12, 16, c => {
  [...CABEZA, ...PIERNAS[n]].forEach((fila, y) => [...fila].forEach((ch, x) => { if (PAL[ch]) { c.fillStyle = PAL[ch]; c.fillRect(x, y, 1, 1); } }));
}));

// Tiles: 1 suelo, 2 ladrillo, 3 "?" moneda, 4 "?" hongo, 5 usado, 6 bloque duro, 7-10 tubería
const IMG = {};
IMG[1] = mk(16, 16, c => { c.fillStyle = '#c84c0c'; c.fillRect(0,0,16,16); c.fillStyle = '#000'; c.fillRect(0,7,16,1); c.fillRect(0,15,16,1); c.fillRect(7,0,1,8); c.fillRect(3,8,1,8); c.fillRect(11,8,1,8); c.fillStyle = '#fcbc78'; c.fillRect(0,0,16,1); });
IMG[2] = mk(16, 16, c => { c.fillStyle = '#e8782c'; c.fillRect(0,0,16,16); c.fillStyle = '#6c2c00'; c.fillRect(0,3,16,1); c.fillRect(0,7,16,1); c.fillRect(0,11,16,1); c.fillRect(0,15,16,1); c.fillRect(7,0,1,4); c.fillRect(3,4,1,4); c.fillRect(11,4,1,4); c.fillRect(7,8,1,4); c.fillRect(3,12,1,4); c.fillRect(11,12,1,4); });
const QF = ['#fcc060', '#fc9838', '#c87810'].map(col => mk(16, 16, c => {
  c.fillStyle = '#6c2c00'; c.fillRect(0,0,16,16); c.fillStyle = col; c.fillRect(1,1,14,14);
  c.fillStyle = '#6c2c00'; c.fillRect(2,2,1,1); c.fillRect(13,2,1,1); c.fillRect(2,13,1,1); c.fillRect(13,13,1,1);
  c.font = 'bold 12px monospace'; c.textAlign = 'center'; c.textBaseline = 'top'; c.fillText('?', 8, 2);
}));
IMG[5] = mk(16, 16, c => { c.fillStyle = '#000'; c.fillRect(0,0,16,16); c.fillStyle = '#a06818'; c.fillRect(1,1,14,14); c.fillStyle = '#6c3c00'; c.fillRect(3,3,2,2); c.fillRect(11,3,2,2); c.fillRect(3,11,2,2); c.fillRect(11,11,2,2); });
IMG[6] = mk(16, 16, c => { c.fillStyle = '#6c3c00'; c.fillRect(0,0,16,16); c.fillStyle = '#e8a050'; c.fillRect(0,0,15,15); c.fillStyle = '#b87830'; c.fillRect(3,3,10,10); c.fillStyle = '#6c3c00'; c.fillRect(15,0,1,16); c.fillRect(0,15,16,1); });
[7, 8, 9, 10].forEach(t => IMG[t] = mk(16, 16, c => {
  const izq = (t === 7 || t === 9), tope = t < 9;
  c.fillStyle = '#000'; c.fillRect(0,0,16,16); c.fillStyle = '#00a800';
  c.fillRect(izq ? 1 : 0, tope ? 1 : 0, 15, tope ? 14 : 16); // cuerpo con borde negro
  c.fillStyle = '#80e030'; c.fillRect(izq ? 3 : 2, tope ? 2 : 0, 3, tope ? 12 : 16);
  c.fillStyle = '#005800'; c.fillRect(izq ? 11 : 10, tope ? 2 : 0, 3, tope ? 12 : 16);
}));

/* ============ 4. ESTADO DEL JUEGO Y NIVEL ============ */
let M, E, COINS, ITEMS, FX, BUMPS, P, cam, st = 'title', score = 0, coins = 0, lives = VIDAS_INI;
let time, deadT, winT, flagY, tick = 0;

function nuevoEnemigo(tipo, col) {
  const koopa = tipo === 'k', h = koopa ? 22 : 15;
  return { t: tipo, x: col * T + 1, y: 12 * T - h, w: 14, h, vx: 0, vy: 0, dir: -1, st: 0, on: false, grace: 0 };
}
function buildLevel() {
  M = Array.from({ length: H }, () => Array(W).fill(0));
  const set = (c, r, t) => { M[r][c] = t; };
  for (let c = 0; c < W; c++) { set(c, 12, 1); set(c, 13, 1); }
  [69, 70, 86, 87, 88, 118, 119].forEach(c => { M[12][c] = 0; M[13][c] = 0; }); // fosos
  // bloques
  set(16, 8, 3); [20, 22, 24].forEach(c => set(c, 8, 2)); set(21, 8, 4); set(23, 8, 3);
  set(77, 8, 2); set(78, 8, 3); set(79, 8, 2);
  for (let c = 90; c <= 97; c++) set(c, 8, 2); set(93, 8, 4); set(95, 8, 3);
  set(112, 8, 2); set(113, 8, 3); set(114, 8, 2);
  // tuberías
  [[28, 2], [38, 3], [46, 3], [57, 2]].forEach(([c, h]) => { for (let i = 0; i < h; i++) { const r = 12 - h + i; set(c, r, i ? 9 : 7); set(c + 1, r, i ? 10 : 8); } });
  // escalera
  for (let i = 0; i < 6; i++) for (let j = 0; j <= i; j++) set(136 + i, 11 - j, 6);
  E = [['g',22],['g',36],['g',52],['g',54],['k',62],['g',74],['g',80],['k',92],['g',100],['g',102],['k',110],['g',124],['g',126],['k',130]].map(([t, c]) => nuevoEnemigo(t, c));
  COINS = [];
  [[41,8],[42,8],[43,8],[66,8],[67,8],[68,8],[86,9],[87,9],[88,9],[104,8],[105,8],[106,8],[107,8]].forEach(([c, r]) => COINS.push({ x: c * T, y: r * T, w: 16, h: 16, got: false }));
  ITEMS = []; FX = []; BUMPS = {}; cam = 0; time = TIEMPO_INI; winT = 0; flagY = 2 * T + 4;
  P = { x: 40, y: 12 * T - 16, w: 12, h: 16, vx: 0, vy: 0, dir: 1, big: false, inv: 0, ground: false, jb: 0, anim: 0, dead: false };
}
const solido = (c, r) => c < 0 || c >= W ? true : (r < 0 || r >= H ? false : M[r][c] > 0);

/* ============ 5. FÍSICA: movimiento + colisiones AABB por ejes ============ */
function mover(b, dt, grav, esJugador) {
  b.hitWall = false; b.ground = false;
  // --- eje X ---
  const dx = b.vx; b.x += b.vx * dt;
  let r0 = Math.floor(b.y / T), r1 = Math.floor((b.y + b.h - .01) / T);
  let c0 = Math.floor(b.x / T), c1 = Math.floor((b.x + b.w - .01) / T);
  for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) if (solido(c, r)) {
    if (dx > 0) b.x = c * T - b.w; else if (dx < 0) b.x = (c + 1) * T;
    b.hitWall = true; b.vx = 0;
  }
  // --- eje Y ---
  b.vy = Math.min(b.vy + grav * dt, CAIDA_MAX); b.y += b.vy * dt;
  r0 = Math.floor(b.y / T); r1 = Math.floor((b.y + b.h - .01) / T);
  c0 = Math.floor(b.x / T); c1 = Math.floor((b.x + b.w - .01) / T);
  let hit = false;
  for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) if (!hit && solido(c, r)) {
    hit = true;
    if (b.vy > 0) { b.y = r * T - b.h; b.ground = true; }
    else {
      b.y = (r + 1) * T;
      if (esJugador) { let cc = Math.floor((b.x + b.w / 2) / T); if (!solido(cc, r)) cc = c; golpear(cc, r); }
    }
    b.vy = 0;
  }
}

/* ============ 6. BLOQUES, OBJETOS Y EFECTOS ============ */
function golpear(c, r) {
  const t = M[r][c]; if (t === 0 || t > 6) return;
  BUMPS[r + ',' + c] = 0;
  if (t === 3) { M[r][c] = 5; FX.push({ k: 'coin', x: c * T + 4, y: r * T - 8, vy: -5, t: 0 }); coins++; score += 200; SFX.moneda(); if (coins >= 100) { coins -= 100; lives++; } }
  else if (t === 4) { M[r][c] = 5; ITEMS.push({ x: c * T + 1, y: r * T, w: 14, h: 14, vx: 0, vy: 0, em: 16, dir: 1 }); SFX.golpe(); }
  else if (t === 2 && P.big) {
    M[r][c] = 0; delete BUMPS[r + ',' + c]; score += 50; SFX.romper();
    [[-1,-4],[1,-4],[-1,-2],[1,-2]].forEach(([vx, vy], i) => FX.push({ k: 'brick', x: c * T + (i % 2) * 8, y: r * T + (i > 1 ? 8 : 0), vx: vx * .9, vy }));
  } else SFX.golpe();
  // enemigos encima del bloque golpeado
  for (const e of E) if (e.ground && !e.ko && e.x + e.w > c * T && e.x < (c + 1) * T && Math.abs(e.y + e.h - r * T) < 2) noquear(e);
}

/* ============ 7. ENEMIGOS ============ */
function noquear(e) { e.ko = true; e.vy = -3; e.vx = Math.random() < .5 ? -.8 : .8; score += 100; SFX.pisar(); }
function pisar(e) {
  SFX.pisar(); score += 100;
  if (e.t === 'g') { e.sq = true; e.tm = 30; e.y += 7; e.h = 8; }
  else if (e.st === 0) { e.st = 1; e.y += 8; e.h = 14; e.grace = 10; }       // se esconde en el caparazón
  else if (e.st === 2) { e.st = 1; e.grace = 10; }                            // detiene el caparazón
  else { e.st = 2; e.dir = P.x + P.w / 2 < e.x + e.w / 2 ? 1 : -1; e.grace = 15; } // lo patea
}
function actualizarEnemigos(dt) {
  for (const e of E) {
    if (e.ko) { e.vy += GRAVEDAD * dt; e.y += e.vy * dt; e.x += e.vx * dt; continue; }
    if (e.sq) { e.tm -= dt; continue; }
    if (!e.on) { if (e.x - cam < 280) e.on = true; else continue; }
    e.grace = Math.max(0, e.grace - dt);
    e.vx = e.st === 1 ? 0 : e.dir * (e.st === 2 ? VEL_CAPARAZON : VEL_ENEMIGO);
    mover(e, dt, GRAVEDAD);
    if (e.hitWall) { e.dir *= -1; if (e.st === 2) SFX.golpe(); }
  }
  // choques entre enemigos
  for (let i = 0; i < E.length; i++) for (let j = i + 1; j < E.length; j++) {
    const a = E[i], b = E[j];
    if (!a.on || !b.on || a.ko || b.ko || a.sq || b.sq || !ov(a, b)) continue;
    if (a.st === 2) noquear(b); else if (b.st === 2) noquear(a);
    else { a.dir = a.x < b.x ? -1 : 1; b.dir = -a.dir; }
  }
  E = E.filter(e => !(e.sq && e.tm <= 0) && !(e.y > 400));
}

/* ============ 8. JUGADOR ============ */
const IN = { l: 0, r: 0, j: 0, s: 0 };
function actualizarJugador(dt) {
  const p = P, d = IN.r - IN.l, correr = IN.s;
  const ac = ACEL * (correr ? 1.5 : 1);
  if (d) { p.vx += d * (p.vx * d < 0 ? ac + FRICC : ac) * dt; p.dir = d; }          // acelera / derrapa
  else { const f = FRICC * dt; p.vx = Math.abs(p.vx) <= f ? 0 : p.vx - Math.sign(p.vx) * f; } // fricción
  const m = correr ? VEL_CORRER : VEL_CAMINAR;
  if (Math.abs(p.vx) > m) p.vx -= Math.sign(p.vx) * Math.min(FRICC * dt, Math.abs(p.vx) - m);
  if (p.jb > 0 && p.ground) { p.vy = FUERZA_SALTO - Math.abs(p.vx) * .25; p.jb = 0; p.ground = false; SFX.salto(); }
  p.jb = Math.max(0, p.jb - dt);
  const grav = p.vy < 0 ? (IN.j ? GRAV_SALTO_MANTENIDO : GRAV_SALTO_SOLTADO) : GRAVEDAD; // salto variable
  mover(p, dt, grav, true);
  p.anim += Math.abs(p.vx) * .12 * dt; p.inv = Math.max(0, p.inv - dt);
  if (p.y > H * T + 8) morir();
}
function morir() { if (P.dead) return; P.dead = true; P.vy = -6; P.vx = 0; lives--; st = 'dying'; deadT = 0; SFX.muerte(); }
function herir() {
  if (P.inv > 0) return;
  if (P.big) { P.big = false; P.h = 16; P.y += 16; P.inv = 120; SFX.dano(); } else morir();
}
function colisiones() {
  for (const e of E) {
    if (e.ko || e.sq || !e.on || !ov(P, e)) continue;
    const pisando = P.vy > 0 && (P.y + P.h - P.vy * .5) <= e.y + 6;
    if (pisando) { pisar(e); P.vy = IN.j ? -5.5 : -3.5; P.y = Math.min(P.y, e.y - P.h); }
    else if (e.t === 'k' && e.st === 1) { e.st = 2; e.dir = P.x < e.x ? 1 : -1; e.grace = 15; SFX.pisar(); }
    else if (e.grace <= 0) herir();
  }
  for (const c of COINS) if (!c.got && ov(P, c)) { c.got = true; coins++; score += 200; SFX.moneda(); if (coins >= 100) { coins -= 100; lives++; } }
  for (const it of ITEMS) if (it.em <= 0 && ov(P, it)) {
    it.rm = true; score += 1000; SFX.hongo();
    if (!P.big) { P.big = true; P.h = 32; P.y -= 16; }
  }
  if (P.x + P.w > POLE * T + 7) { st = 'win'; winT = 0; P.vx = 0; P.vy = 0; P.x = POLE * T - 5; score += Math.ceil(time) * 10; SFX.victoria(); }
}

/* ============ 9. BUCLE PRINCIPAL ============ */
function actualizar(dt) {
  tick += dt;
  if (st === 'dying') {
    P.vy += GRAVEDAD * dt; P.y += P.vy * dt; deadT += dt;
    if (deadT > 150) { if (lives > 0) { buildLevel(); st = 'play'; } else st = 'over'; }
    return;
  }
  if (st === 'win') {
    winT += dt; const suelo = 12 * T;
    P.y = Math.min(P.y + 2 * dt, suelo - P.h); flagY = Math.min(flagY + 2 * dt, 11 * T - 8);
    if (winT > 150) st = 'won';
  } else if (st === 'play') {
    time -= dt / 60; if (time <= 0) { time = 0; morir(); return; }
    actualizarJugador(dt); actualizarEnemigos(dt);
    for (const it of ITEMS) {
      if (it.em > 0) { it.y -= dt; it.em -= dt; continue; }
      it.vx = it.dir * .7; mover(it, dt, GRAVEDAD); if (it.hitWall) it.dir *= -1; if (it.y > 300) it.rm = true;
    }
    colisiones();
    ITEMS = ITEMS.filter(i => !i.rm);
    for (const k in BUMPS) { BUMPS[k] += dt; if (BUMPS[k] > 8) delete BUMPS[k]; }
    for (const f of FX) { f.t = (f.t || 0) + dt; f.vy += (f.k === 'coin' ? .35 : GRAVEDAD) * dt; f.y += f.vy * dt; if (f.vx) f.x += f.vx * dt; }
    FX = FX.filter(f => f.k === 'coin' ? f.t < 38 : f.y < VH + 20);
  } else return;
  // cámara suave que sigue al jugador
  cam += (P.x - 110 - cam) * .1 * dt; cam = Math.max(0, Math.min(cam, W * T - VW));
}
let last = performance.now();
function loop(ts) { const dt = Math.min((ts - last) / 16.667, 2); last = ts; actualizar(dt); dibujar(); requestAnimationFrame(loop); }

/* ============ 10. RENDER ============ */
function nube(x, y) { g.fillStyle = '#fff'; fr(x + 8, y, 16, 4); fr(x + 4, y + 4, 24, 4); fr(x, y + 8, 32, 8); g.fillStyle = '#a8d8fc'; fr(x, y + 14, 32, 2); }
function colina(x, w) {
  const gy = 192;
  for (let k = 0; w - 16 * k >= 16; k++) {
    g.fillStyle = '#00a800'; fr(x + 8 * k, gy - 8 * (k + 1), w - 16 * k, 8);
    g.fillStyle = '#005800'; fr(x + 8 * k, gy - 8 * (k + 1), 1, 8); fr(x + w - 8 * k - 1, gy - 8 * (k + 1), 1, 8);
  }
  g.fillStyle = '#000'; fr(x + w / 2 - 6, gy - w / 2 + 4, 2, 6); fr(x + w / 2 + 4, gy - w / 2 + 4, 2, 6);
}
function arbusto(x) { g.fillStyle = '#00a800'; fr(x + 8, 176, 32, 4); fr(x + 4, 180, 40, 4); fr(x, 184, 48, 8); g.fillStyle = '#58d854'; fr(x + 12, 178, 4, 2); fr(x + 28, 182, 4, 2); }
function dMoneda(x, y, a) {
  const w = Math.max(2, Math.abs(Math.cos(a / 6)) * 8);
  g.fillStyle = '#f8b800'; fr(x + 8 - w / 2, y + 2, w, 12); g.fillStyle = '#fcfc90'; fr(x + 8 - w / 2 + 1, y + 4, Math.max(1, w - 3), 8);
}
function dEnemigo(e) {
  const x = Math.round(e.x), y = Math.round(e.y), f = Math.floor(tick / 10) % 2;
  g.save(); if (e.ko) { g.translate(0, 2 * y + e.h); g.scale(1, -1); }
  if (e.t === 'g') {
    if (e.sq) { g.fillStyle = '#a84800'; fr(x - 1, y, 16, 8); g.fillStyle = '#000'; fr(x + 2, y + 3, 3, 2); fr(x + 9, y + 3, 3, 2); }
    else {
      g.fillStyle = '#a84800'; fr(x + 2, y, 10, 2); fr(x, y + 2, 14, 6);
      g.fillStyle = '#fcc090'; fr(x + 3, y + 8, 8, 4);
      g.fillStyle = '#fff'; fr(x + 2, y + 3, 4, 4); fr(x + 8, y + 3, 4, 4);
      g.fillStyle = '#000'; fr(x + 3, y + 4, 2, 3); fr(x + 9, y + 4, 2, 3); fr(x + 2, y + 2, 4, 1); fr(x + 8, y + 2, 4, 1);
      if (f) { fr(x, y + 12, 6, 3); fr(x + 8, y + 13, 6, 2); } else { fr(x + 1, y + 13, 6, 2); fr(x + 8, y + 12, 6, 3); }
    }
  } else if (e.st === 0) {
    const d = e.dir > 0;
    g.fillStyle = '#f8d878'; fr(x + (d ? 6 : 0), y, 8, 9); g.fillStyle = '#000'; fr(x + (d ? 11 : 2), y + 2, 2, 2);
    g.fillStyle = '#00a800'; fr(x + 1, y + 8, 12, 10); g.fillStyle = '#58d854'; fr(x + 3, y + 10, 3, 3); fr(x + 8, y + 13, 3, 3);
    g.fillStyle = '#f8d878'; if (f) { fr(x + 1, y + 18, 5, 4); fr(x + 8, y + 19, 5, 3); } else { fr(x + 1, y + 19, 5, 3); fr(x + 8, y + 18, 5, 4); }
  } else {
    g.fillStyle = '#00a800'; fr(x + 2, y, 10, 2); fr(x, y + 2, 14, 8);
    g.fillStyle = '#f8f0c0'; fr(x + 1, y + 10, 12, 4); g.fillStyle = '#58d854'; fr(x + 4, y + 3, 3, 3); fr(x + 9, y + 5, 3, 3);
  }
  g.restore();
}
function dHongo(it) {
  const x = Math.round(it.x), y = Math.round(it.y);
  g.fillStyle = '#d82800'; fr(x + 2, y, 10, 2); fr(x, y + 2, 14, 5);
  g.fillStyle = '#fff'; fr(x + 3, y + 2, 3, 3); fr(x + 9, y + 2, 3, 3);
  g.fillStyle = '#fcd8a8'; fr(x + 2, y + 7, 10, 7); g.fillStyle = '#000'; fr(x + 4, y + 9, 2, 3); fr(x + 8, y + 9, 2, 3);
}
function dJugador() {
  const p = P; if (p.inv > 0 && Math.floor(tick / 3) % 2 && !p.dead) return;
  let f = 0;
  if (p.dead || st === 'win' || !p.ground) f = 3; else if (Math.abs(p.vx) > .15) f = [1, 0, 2, 0][Math.floor(p.anim) % 4];
  g.save(); g.translate(Math.round(p.x + p.w / 2), Math.round(p.y));
  if (p.dir < 0) g.scale(-1, 1);          // voltea según la dirección
  g.drawImage(SPR[f], -6, 0, 12, p.h);   // grande = sprite estirado
  g.restore();
}
function txt(s, x, y, col = '#fff', al = 'left', size = 8) {
  g.font = 'bold ' + size + 'px "Courier New",monospace'; g.textAlign = al; g.textBaseline = 'top';
  g.fillStyle = '#000'; g.fillText(s, x + 1, y + 1); g.fillStyle = col; g.fillText(s, x, y);
}
function dibujar() {
  g.fillStyle = '#5c94fc'; g.fillRect(0, 0, VW, VH);
  const cx = Math.round(cam);
  // parallax: nubes lentas (0.3) y colinas (0.5)
  [[0, 24], [130, 40], [260, 18], [380, 48]].forEach(([o, y]) => nube(((o - cx * .3) % 480 + 480) % 480 - 48, y));
  [[0, 96], [260, 64]].forEach(([o, w]) => colina(((o - cx * .5) % 520 + 520) % 520 - 100, w));
  g.save(); g.translate(-cx, 0);
  [8, 33, 50, 74, 102].forEach(c => arbusto(c * T));
  for (const it of ITEMS) dHongo(it);
  for (const c of COINS) if (!c.got) dMoneda(c.x, c.y, tick + c.x);
  const c0 = Math.floor(cx / T), qf = [0, 0, 0, 1, 2, 1][Math.floor(tick / 8) % 6];
  for (let r = 0; r < H; r++) for (let c = c0; c <= Math.min(c0 + 17, W - 1); c++) {
    const t = M[r][c]; if (!t) continue;
    const b = BUMPS[r + ',' + c], off = b === undefined ? 0 : -Math.sin(b / 8 * Math.PI) * 6;
    g.drawImage(t === 3 || t === 4 ? QF[qf] : IMG[t], c * T, r * T + Math.round(off));
  }
  // bandera
  const px = POLE * T + 7;
  g.fillStyle = '#00a800'; fr(px, 2 * T, 2, 10 * T); g.fillStyle = '#f8d800'; fr(px - 2, 2 * T - 6, 6, 6);
  g.fillStyle = '#f8f8f8'; g.beginPath(); g.moveTo(px, flagY); g.lineTo(px - 16, flagY + 8); g.lineTo(px, flagY + 16); g.fill();
  g.fillStyle = '#00a800'; fr(px - 7, flagY + 6, 3, 4);
  for (const e of E) if (e.on || e.ko) dEnemigo(e);
  for (const f of FX) {
    if (f.k === 'coin') dMoneda(f.x - 4, f.y, f.t * 2);
    else { g.fillStyle = '#e8782c'; fr(f.x, f.y, 8, 8); g.fillStyle = '#6c2c00'; fr(f.x, f.y + 7, 8, 1); }
  }
  dJugador();
  g.restore();
  // HUD
  [['PUNTOS', String(score).padStart(6, '0')], ['MONEDAS', 'x' + String(coins).padStart(2, '0')], ['NIVEL', '1-1'], ['VIDAS', 'x' + Math.max(0, lives)], ['TIEMPO', String(Math.ceil(time)).padStart(3, '0')]]
    .forEach(([a, b], i) => { txt(a, 8 + i * 50, 8); txt(b, 8 + i * 50, 18); });
  // pantallas
  const cap = (a, b, c) => {
    g.fillStyle = 'rgba(0,0,0,.55)'; g.fillRect(0, 0, VW, VH);
    txt(a, 128, 70, '#fcd838', 'center', 16); if (b) txt(b, 128, 100, '#fff', 'center', 8);
    if (Math.floor(tick / 30) % 2) txt(c, 128, 150, '#fff', 'center', 8);
  };
  if (st === 'title') { cap('SUPER FONTANERO', 'Flechas/A-D mover · Espacio/W saltar · Shift correr', 'PULSA ENTER O TOCA PARA EMPEZAR'); }
  if (st === 'over') cap('GAME OVER', 'Puntos: ' + score, 'ENTER O TOCA PARA REINICIAR');
  if (st === 'won') cap('¡NIVEL COMPLETADO!', 'Puntos: ' + score, 'ENTER O TOCA PARA JUGAR DE NUEVO');
}

/* ============ 11. ENTRADA (teclado + táctil) ============ */
const MAP = { ArrowLeft: 'l', KeyA: 'l', ArrowRight: 'r', KeyD: 'r', Space: 'j', KeyW: 'j', ArrowUp: 'j', ShiftLeft: 's', ShiftRight: 's' };
function setIn(k, v) { if (k === 'j' && v && !IN.j && P) P.jb = 6; IN[k] = v ? 1 : 0; } // buffer de salto
function accion() { if (st === 'title' || st === 'over' || st === 'won') { score = 0; coins = 0; lives = VIDAS_INI; buildLevel(); st = 'play'; } }
addEventListener('keydown', e => {
  initAudio(); const k = MAP[e.code];
  if (k) { e.preventDefault(); setIn(k, 1); }
  if ((e.code === 'Enter' || e.code === 'Space') && !e.repeat) accion();
});
addEventListener('keyup', e => { const k = MAP[e.code]; if (k) setIn(k, 0); });
addEventListener('blur', () => { for (const k in IN) IN[k] = 0; });
cv.addEventListener('pointerdown', () => { initAudio(); accion(); });
document.querySelectorAll('.b').forEach(b => {
  const k = b.dataset.k;
  b.addEventListener('pointerdown', e => { e.preventDefault(); initAudio(); accion(); setIn(k, 1); b.classList.add('on'); });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => b.addEventListener(ev, () => { setIn(k, 0); b.classList.remove('on'); }));
});

/* ============ 12. ARRANQUE ============ */
buildLevel();
requestAnimationFrame(loop);
</script>
